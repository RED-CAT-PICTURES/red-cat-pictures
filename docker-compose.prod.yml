version: '3.9'
services:
  app:
    image: ghcr.io/red-cat-pictures/red-cat-pictures:latest@sha256:a740d3b88cf6120b2d2fdb716ce1d94a6e0d5e9e2db85d2c39b77c5858b9f59f
    env_file:
      - .env
    volumes:
      - red-cat-pictures_data:/app/.data
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider -q http://localhost:3000/api/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 3

volumes:
  red-cat-pictures_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /root/red-cat-pictures/.data

networks:
  internal:
    driver: overlay
