services:
  documenso:
    image: documenso/documenso:v2.14.0@sha256:f1043654ffd88edffa6ba5b2bbda2897723fc5e9ae06f56c1fe514ee2b567f05
    env_file:
      - .env
    volumes:
      - /root/documenso-rcp/certificate.p12:/opt/documenso/cert.p12
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider -q http://localhost:3000/api/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: 'on-failure:3'
    deploy:
      resources:
        limits:
          cpus: '1'

  postgres:
    image: postgres:16@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
    env_file:
      - .env
    volumes:
      - documenso-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: 'on-failure:3'

volumes:
  documenso-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /root/documenso-rcp/database

networks:
  internal:
    driver: bridge
