services:
  documenso:
    image: documenso/documenso:v2.22.0@sha256:f9976d2142d34ee89506e161b0a5ec859a0c327f3fe0a398b46d3941fc8dd35e
    env_file:
      - .env
    volumes:
      - /root/documenso-rcp/certificate.p12:/opt/documenso/cert.p12
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider -q http://localhost:3000/api/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: 'on-failure:3'
    deploy:
      resources:
        limits:
          cpus: '1'

  postgres:
    image: postgres:16
    env_file:
      - .env
    volumes:
      - documenso-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: 'on-failure:3'

volumes:
  documenso-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /root/documenso-rcp/database

networks:
  internal:
    driver: bridge
