services:
  cloudreve:
    image: cloudreve/cloudreve:4.17.0
    env_file:
      - .env
    volumes:
      - backend-data:/cloudreve/data
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider -q http://localhost:5212 || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
    restart: 'on-failure:3'
    deploy:
      resources:
        limits:
          cpus: '1'

  postgres:
    image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    env_file:
      - .env
    volumes:
      - database-postgres:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: 'on-failure:3'

  redis:
    image: redis:latest
    volumes:
      - redis-data:/data
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping']
      interval: 30s
      timeout: 5s
      retries: 3
    restart: 'on-failure:3'

volumes:
  backend-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /root/cloudreve-rcp/data
  database-postgres:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /root/cloudreve-rcp/postgres
  redis-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /root/cloudreve-rcp/redis

networks:
  internal:
    driver: bridge
