name: Recover Keystore

on:
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Decode Keystore & Export Credentials
        run: |
          mkdir -p recovery
          echo "${{ secrets.ANDROID_KEY_BASE64 }}" | base64 -d > recovery/release-keystore.jks
          echo "Alias: ${{ secrets.ANDROID_KEY_ALIAS }}" > recovery/credentials.txt
          echo "Password: ${{ secrets.ANDROID_KEY_PASSWORD }}" >> recovery/credentials.txt

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: keystore-backup
          path: recovery/
          retention-days: 1
